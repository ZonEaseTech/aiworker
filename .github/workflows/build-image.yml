name: build-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (leave empty for <short-sha>-<UTC yyyymmddhhmm>)
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - Dockerfile
      - bun.lock
      - package.json
      - .github/workflows/build-image.yml

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        name: Compute image tag
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            SHA=$(git rev-parse --short HEAD)
            STAMP=$(date -u +%Y%m%d%H%M)
            TAG="${SHA}-${STAMP}"
          fi
          IMAGE="ghcr.io/zoneasetech/aiworker"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Will publish $IMAGE:$TAG and $IMAGE:$TAG-full"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim

      - name: Build + push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-full
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-full
            ${{ steps.meta.outputs.image }}:latest-full
          cache-from: |
            type=gha,scope=slim
            type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full

      - name: Summary
        run: |
          {
            echo "## Images published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-full"
            echo "${{ steps.meta.outputs.image }}:latest"
            echo "${{ steps.meta.outputs.image }}:latest-full"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
