name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Web lint
        run: bun run --filter '@zonease/aiworker-worker-web' lint

      - name: Web test
        run: bun run --filter '@zonease/aiworker-worker-web' test

      - name: Web build
        run: bun run --filter '@zonease/aiworker-worker-web' build

      - name: Web shared cycle check
        run: bun run --filter '@zonease/aiworker-worker-web' check:shared-cycles

      - name: Web bundle size report
        run: bun run --filter '@zonease/aiworker-worker-web' size:report
