name: release

# Tag scheme:
#   aiworker-v<version> -> publish @zonease/aiworker-cli
#   v<version>          -> same AIWorker CLI publish path for single-package releases
on:
  push:
    tags: ['v*', 'aiworker-v*']

permissions:
  contents: write
  id-token: write

jobs:
  release-aiworker:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Assert git tag matches aiworker-cli version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#aiworker-v}"; version="${version#v}"
          aiworker_version="$(node -p "require('./apps/aiworker-cli/package.json').version")"
          if [[ "$version" != "$aiworker_version" ]]; then
            echo "git tag/aiworker-cli version mismatch — tag=$version aiworker-cli=$aiworker_version" >&2
            exit 1
          fi
      - name: Release check
        run: bun run release:check
      - name: Derive npm dist-tag from git tag
        id: channel
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#aiworker-v}"; version="${version#v}"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"; channel="${channel%%.*}"
          else
            channel="latest"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Publish AIWorker CLI to npm
        working-directory: apps/aiworker-cli/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "${{ steps.channel.outputs.channel }}"
