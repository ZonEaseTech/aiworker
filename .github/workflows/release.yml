name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release check
        run: bun run release:check

      - name: Publish to npm
        working-directory: apps/cli/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Compile single-file binaries
        run: |
          set -euo pipefail
          bun build --compile --target=bun-linux-x64    --outfile=aiworker-linux-x64    apps/cli/src/aiworker.ts
          bun build --compile --target=bun-linux-arm64  --outfile=aiworker-linux-arm64  apps/cli/src/aiworker.ts
          bun build --compile --target=bun-darwin-x64   --outfile=aiworker-darwin-x64   apps/cli/src/aiworker.ts
          bun build --compile --target=bun-darwin-arm64 --outfile=aiworker-darwin-arm64 apps/cli/src/aiworker.ts

      - name: Package binary release bundles
        run: bun apps/cli/scripts/package-release-bundles.ts

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            aiworker-linux-x64.tar.gz
            aiworker-linux-arm64.tar.gz
            aiworker-darwin-x64.tar.gz
            aiworker-darwin-arm64.tar.gz
            aiworker-linux-x64.tar.gz.sha256
            aiworker-linux-arm64.tar.gz.sha256
            aiworker-darwin-x64.tar.gz.sha256
            aiworker-darwin-arm64.tar.gz.sha256
