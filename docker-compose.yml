version: '3.9'

name: aiworker

networks:
  aiworker_default:
    name: aiworker_default
    driver: bridge

services:
  dashboard:
    image: aiworker-runtime:dev
    build:
      context: .
    container_name: aiworker-dashboard
    restart: unless-stopped
    networks:
      - aiworker_default
    ports:
      - '9218:9218'
    environment:
      AIWORKER_MODE: dashboard
      NODE_ENV: development
      PORT: 9218
      FLEET_DB_PATH: /var/lib/aiworker/fleet.db
      FLEET_MIGRATIONS_FOLDER: /app/drizzle/fleet
      AIWORKER_MASTER_KEY: ${AIWORKER_MASTER_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-dev-internal-secret-1234567890}
      DOCKER_HOST: /var/run/docker.sock
      AIWORKER_IMAGE: aiworker-runtime:dev
      AIWORKER_NETWORK: aiworker_default
      WORKER_DATA_ROOT: /var/lib/aiworker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - aiworker_fleet:/var/lib/aiworker

volumes:
  aiworker_fleet:
    name: aiworker_fleet
