<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIWorker Common Workbench</title>
  <script type="module" crossorigin src="./assets/index.js"></script>
</head>
<body>
  <!--
    Static workbench shell (方案 C build foundation): the module sections and the
    markers the mount proofs assert are static HTML, so they render the moment the
    bundle's index.html mounts — independent of React runtime/timing inside the
    micro-app sandbox. The Vite-built bundle loads and progressively enhances the
    interactive modules (chat, config, lifecycle) into #aiworker-workbench-root in
    later sub-projects.
  -->
  <main
    data-aiworker-common-workbench="true"
    data-aiworker-bridge-event-refs="engine-invocations,engine-invocation-events"
  >
    <h1>AIWorker Common Workbench</h1>
    <section data-module="worker-configuration-summary"><h2>Worker configuration summary</h2></section>
    <section data-module="engine-target-readiness"><h2>Engine target readiness</h2></section>
    <section data-module="skills-overlay-summary"><h2>Skills overlay summary</h2></section>
    <section data-module="mcp-overlay-summary"><h2>MCP overlay summary</h2></section>
    <section data-module="entry-workspace-files-summary"><h2>Entry workspace files summary</h2></section>
    <section data-module="session-controls"><h2>Session controls</h2></section>
    <section data-module="bridge-event-stream">
      <h2>Bridge event refs</h2>
      <p>engine_invocations / engine invocation events</p>
    </section>
    <section data-module="projection-receipt-status"><h2>Projection receipt status</h2></section>
    <section data-module="archive-controls"><h2>Archive controls</h2></section>
    <div id="aiworker-workbench-root"></div>
  </main>
</body>
</html>
