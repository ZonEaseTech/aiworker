name: aiworker

services:
  dashboard:
    # Image tag resolves to ghcr.io/zoneasetech/aiworker:${TAG}${VARIANT_SUFFIX}
    # where VARIANT_SUFFIX is empty (slim, default) or `-full` (FEAT-020 bake
    # with agentic CLIs baked in). `scripts/deploy.ts install --image-variant`
    # sets the suffix for one-shot deploys; the host `.env` holds the default
    # for manual `docker compose up -d`.
    image: ghcr.io/zoneasetech/aiworker:${AIWORKER_IMAGE_TAG}${AIWORKER_IMAGE_VARIANT_SUFFIX}
    container_name: aiworker-dashboard
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      AIWORKER_MODE: dashboard
      NODE_ENV: production
      PORT: '3000'
      FLEET_DB_PATH: /var/lib/aiworker/fleet.db
      FLEET_MIGRATIONS_FOLDER: /app/drizzle/fleet
      AIWORKER_MASTER_KEY: ${AIWORKER_MASTER_KEY}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      MANAGER_POLL_INTERVAL_MS: '30000'
      MANAGER_POLL_JITTER_MS: '3000'
    volumes:
      - aiworker_fleet:/var/lib/aiworker

volumes:
  aiworker_fleet:
    name: aiworker_fleet
