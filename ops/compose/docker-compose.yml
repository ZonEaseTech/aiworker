# REFACTOR-004 起,本 compose **仅适用其他自托管者**——测试服已硬约束为
# `npm install -g @zonease/aiworker-cli` + `aiworker install systemd` + Caddy,
# 不再走 docker compose 路径(CLAUDE.md "Project Preferences")。
#
# PLAN-016 起,docker compose 是**可选 fast-launch** 形态——主部署路径是
# 裸跑 (`aiworker gateway start` / `aiworker serve`) 或 systemd (`aiworker install systemd`)。
# 详见 docs/deployment.md;仅在不愿装 bun、或需要 `aiworker fleet launch`
# per-worker 容器隔离时才走本路径。公网 HTTPS 反代见
# docs/deployment-public-https.md(独立可选叠加层)。

name: aiworker

services:
  # PLAN-013 S5: gateway 取代 dashboard 成为控制面入口。
  # 负责:fleet.db 管理、workers.pair / workers.launch / token.rotate 等
  # operator-to-gateway 方法,以及 operator ↔ node 的请求转发。
  # web 静态资源和 /api/* REST 均已下线;浏览器走 ws://…/ws 协议。
  gateway:
    image: ghcr.io/zoneasetech/aiworker:${AIWORKER_IMAGE_TAG}${AIWORKER_IMAGE_VARIANT_SUFFIX}
    container_name: aiworker-gateway
    restart: unless-stopped
    command: [bun, packages/gateway/src/index.ts]
    ports:
      - '127.0.0.1:9218:9218'
    environment:
      NODE_ENV: production
      AIWORKER_GATEWAY_PORT: '9218'
      AIWORKER_GATEWAY_HOST: 0.0.0.0
      AIWORKER_FLEET_DB_PATH: /var/lib/aiworker/fleet.db
      AIWORKER_MASTER_KEY: ${AIWORKER_MASTER_KEY}
      # gateway ↔ 远程 node 双向鉴权密钥。浏览器经 Caddy/loopback 连接时
      # 无需携带(loopback 自动放行)。
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
    volumes:
      - aiworker_fleet:/var/lib/aiworker

volumes:
  aiworker_fleet:
    name: aiworker_fleet
