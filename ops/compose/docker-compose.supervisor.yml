# PLAN-013 S5 — gateway launch 能力 overlay。
#
# 把本文件与 docker-compose.yml 组合启动,gateway 才能通过 docker daemon 拉起
# 新的 worker 容器(需要打开 AIWORKER_GATEWAY_CAN_LAUNCH 开关):
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.supervisor.yml \
#     --env-file .env \
#     up -d
#
# PRE-FLIGHT:
#
#   1. INTERNAL_SHARED_SECRET 必须就绪——它既是远程 operator 连接 gateway 的
#      bearer,也会注入到 launch 的 worker 容器 env 里作为 node 侧鉴权基线。
#   2. 在宿主上提前准备 worker 数据目录(docker daemon 写):
#        sudo install -d -o root -g root -m 0755 /opt/aiworker-workers
#   3. `/var/run/docker.sock` 以只读方式挂进 gateway 容器。
#
# overlay 只覆盖 environment + volumes 增量,不重定义 service 结构。

services:
  gateway:
    environment:
      # 打开 launch 能力;未开启时 `workers.launch` 直接返回 feature_disabled。
      AIWORKER_GATEWAY_CAN_LAUNCH: 'true'

      # 可选配额上限(fleet 行数)。留空即不限。
      AIWORKER_MAX_WORKERS: ${AIWORKER_MAX_WORKERS:-}

      # canLaunch=true 时必填:新拉起的 worker 容器需要镜像 / 数据目录 / 资源限额。
      AIWORKER_IMAGE: ghcr.io/zoneasetech/aiworker:${AIWORKER_IMAGE_TAG}${AIWORKER_IMAGE_VARIANT_SUFFIX}
      WORKER_DATA_ROOT: /opt/aiworker-workers
      WORKER_MEMORY_LIMIT: ${WORKER_MEMORY_LIMIT:-512m}
      WORKER_CPU_LIMIT: ${WORKER_CPU_LIMIT:-1.0}

      # compose 会按 `name: aiworker` 的前缀自动建 `<name>_default` 网络;
      # gateway 与被 spawn 的 worker 容器都接这个网络,
      # http://{containerName}:9217 才能互相解析（FEAT-030）。
      AIWORKER_NETWORK: aiworker_default
      AIWORKER_LAUNCH_BASE_URL_TEMPLATE: ${AIWORKER_LAUNCH_BASE_URL_TEMPLATE:-http://{containerName}:9217}

    volumes:
      # docker.sock:只读足够 create/start/stop/logs。严禁挂入前请确认 gateway
      # 前面有 Caddy / 反代做 IP / basic auth 层层防护。
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      # worker 数据目录。容器内 / 容器外路径必须一致,docker daemon 接收到的
      # Binds 由 gateway 按字面量写入,daemon 运行在宿主上看到的是宿主路径。
      - '/opt/aiworker-workers:/opt/aiworker-workers'
