# Example worker compose (FEAT-022).
#
# Dashboard and worker run in separate compose projects / hosts by design —
# PLAN-004 data-domain boundary: fleet.db is the dashboard's, worker.db is the
# worker's; they only talk over HTTP bearer auth. This file is a starting
# point for provisioning one worker. Adjust service name, volume names, and
# the dashboard URL before copying onto a host.
#
# Minimum workflow:
#   1. On the dashboard UI, click Register worker → Generate → copy the
#      `AIWORKER_FORCE_TOKEN=...` line (FEAT-017).
#   2. Paste it + a fresh `openssl rand -hex 32` into this file's .env.
#   3. Start the worker: `docker compose -f docker-compose.worker.example.yml up -d`.
#   4. Go back to the dashboard, finish the Register dialog with the same
#      token and a reachable Base URL (see `docs/deployment.md`).
#
# For agentic executors (claude-code / codex / acp gemini / acp qwen / cursor):
#   - Use the `-full` image tag to skip the `npx` cold-fetch on first run
#     (FEAT-020). Cursor requires a manual install — see
#     `docs/executor-engines.md#cursor`.
#   - Seed login state. Two approaches; uncomment the section that fits.

name: aiworker-worker-example

services:
  worker:
    # Full variant bakes claude-code / codex / gemini-cli / qwen-code; strip
    # the `-full` suffix to stay on slim and pay cold npx fetches instead.
    image: ghcr.io/zoneasetech/aiworker:${AIWORKER_IMAGE_TAG:-latest}-full
    container_name: aiworker-worker-example
    restart: unless-stopped
    # Worker listens on 9217 (FEAT-030). Expose it to the dashboard's network
    # (same compose, same docker network, or a proxy fronted by HTTPS) — here
    # we only bind loopback so operators can curl it for smoke tests.
    ports:
      - '127.0.0.1:9217:9217'
    environment:
      AIWORKER_MODE: worker
      NODE_ENV: production
      PORT: '9217'

      # REQUIRED. 32-byte hex (64 chars). Worker-local encryption key for
      # worker_secrets + worker_identity. Generate once per worker:
      #   openssl rand -hex 32
      # BACK IT UP — losing it bricks the worker's stored bearer token.
      AIWORKER_MASTER_KEY: ${AIWORKER_MASTER_KEY}

      # REQUIRED for the dashboard proxy. >= 16 chars.
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}

      # OPTIONAL (FEAT-017). Set ONCE, on a fresh worker (no worker_identity
      # row yet). Tells the worker to accept this exact token as its bearer
      # instead of minting a new one. The dashboard Register dialog's
      # `Generate` button prints the value to paste here.
      # AIWORKER_FORCE_TOKEN: ${AIWORKER_FORCE_TOKEN}

      # OPTIONAL. External URL the manager will hit for proxy calls. Only
      # needed when the worker is reachable at a different hostname than
      # the one the operator typed into the Register dialog's Base URL.
      # AIWORKER_ADVERTISED_BASE_URL: http://aiworker-worker-example:9217

      # OPTIONAL (FEAT-015). Slot budget overrides for ProcessManager.
      # MAX_CONCURRENT_TOTAL: '4'
      # MAX_CONCURRENT_CLAUDE_CODE: '2'

      # OPTIONAL (FEAT-012 / 015). Git worktree mode for agentic CLI
      # workspaces. Leave unset for plain tmp dirs.
      # WORKER_WORKSPACE_GIT_ORIGIN: /srv/example-repo
    volumes:
      - aiworker_worker:/var/lib/aiworker

      # Auth recipe A — host mount (see docs/executor-engines.md#auth-recipes).
      # Mount the operator's already-logged-in CLI auth dir into the
      # container's $HOME. Read-only is strongly preferred — the CLI won't
      # be able to rotate the host's token, but worker runs don't need that.
      #
      # - ${HOME}/.claude.json:/root/.claude.json:ro
      # - ${HOME}/.codex:/root/.codex:ro
      # - ${HOME}/.gemini:/root/.gemini:ro
      # - ${HOME}/.qwen:/root/.qwen:ro
      # - ${HOME}/.cursor:/root/.cursor:ro

      # Auth recipe B — dedicated volume, seeded via `docker exec`:
      #   docker compose up -d worker
      #   docker exec -it aiworker-worker-example claude login
      #   ... repeat per CLI the operator wants to enable
      # Data persists across worker container recreates thanks to the volume.
      # - aiworker_worker_home:/root

volumes:
  aiworker_worker:
    name: aiworker_worker
  # Uncomment with Auth recipe B:
  # aiworker_worker_home:
  #   name: aiworker_worker_home
